<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Bartosz Osiej</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080C18;
      --bg-2: #0D1221;
      --bg-card: #111827;
      --cyan: #00D4FF;
      --violet: #7C3AED;
      --white: #F0F4FF;
      --gray-1: #94A3B8;
      --border: rgba(0, 212, 255, 0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      overflow: hidden;
    }
    #auth-screen, #admin-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg), var(--bg-2));
    }
    .auth-box, .admin-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      min-width: 320px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .auth-box h2, .admin-box h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--cyan);
    }
    input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--white);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .admin-content { padding-top: 20px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 6px; color: var(--gray-1); font-size: 0.85rem; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--white); font-family: inherit; font-size: 0.9rem; }
    .preview { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-top: 20px; max-height: 300px; overflow-y: auto; }
    .preview h4 { color: var(--cyan); margin-bottom: 10px; font-size: 0.9rem; }
    .msg { padding: 10px; border-radius: 6px; margin-bottom: 16px; text-align: center; }
    .msg.success { background: rgba(74, 222, 128, 0.1); color: #4ADE80; border: 1px solid rgba(74, 222, 128, 0.3); }
  </style>
</head>
<body>
  <div id="auth-screen">
    <div class="auth-box">
      <h2>🔐 Admin Panel</h2>
      <input type="password" id="pwd" placeholder="password" autofocus />
      <button onclick="checkPwd()">Enter</button>
    </div>
  </div>

  <div id="admin-screen" style="display:none">
    <div class="admin-box">
      <h2>⚙️ Configuracja</h2>
      <div class="admin-content">
        <div class="form-group">
          <label for="hero">Hero Title</label>
          <input type="text" id="hero" placeholder="Imię i nazwisko" />
        </div>
        <div class="form-group">
          <label for="heroDesc">Hero Description</label>
          <input type="text" id="heroDesc" placeholder="_opis" />
        </div>
        <div class="form-group">
          <label for="projTitle">Project Title</label>
          <input type="text" id="projTitle" />
        </div>
        <div class="form-group">
          <label for="projUrl">Project URL</label>
          <input type="url" id="projUrl" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label for="projDesc">Project Desc</label>
          <input type="text" id="projDesc" />
        </div>
        <button onclick="addProject()">Add Project</button>
        <div class="preview">
          <h4>Live Preview</h4>
          <div id="preview"></div>
        </div>
        <div id="msg"></div>
        <button onclick="saveData()" style="margin-top:20px">💾 Save to localStorage</button>
        <button onclick="loadData()" style="margin-top:10px">📂 Load Demo Data</button>
      </div>
    </div>
  </div>

  <script>
    const PASS = 'host';
    const DEFAULTS = {
      hero: 'Bartosz Osiej',
      heroDesc: 'AI Systems Engineer',
      projects: [
        { name: 'LinkShort', url: 'https://fastapiurl.onrender.com', desc: 'JWT URL shortener' },
        { name: 'AI Chat Proxy', url: 'https://ai-chat-proxy.onrender.com', desc: '18+ AI models' },
        { name: 'GraphQL Blog', url: 'https://graphql-blog-lxjy.onrender.com/graphql', desc: 'Blog API' }
      ],
      skills: [
        { icon: '⚙️', skills: [{ n: 'AI Infrastructure', p: 92 }, { n: 'Python', p: 95 }, { n: 'Go', p: 85 }, { n: 'PostgreSQL', p: 88 }] },
        { icon: '☁️', skills: [{ n: 'AWS', p: 82 }, { n: 'Docker', p: 90 }, { n: 'Kubernetes', p: 70 }, { n: 'Terraform', p: 65 }] }
      ],
      experience: [
        { date: '2024 — teraz', role: 'AI Systems Engineer', company: 'Freelance', desc: 'Budowanie API, systemów ML, automatizacja.' },
        { date: '2020 — 2024', role: 'Backend Developer', company: 'Various', desc: 'Skalowalne systemy backendu.' }
      ]
    };

    function checkPwd() {
      if (document.getElementById('pwd').value === PASS) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('admin-screen').style.display = 'block';
        loadForm();
      } else {
        alert('Wrong password');
      }
    }

    function loadForm() {
      document.getElementById('hero').value = DEFAULTS.hero;
      document.getElementById('heroDesc').value = DEFAULTS.heroDesc;
    }

    function addProject() {
      const p = { name: document.getElementById('projTitle').value, url: document.getElementById('projUrl').value, desc: document.getElementById('projDesc').value };
      document.getElementById('projTitle').value = '';
      document.getElementById('projUrl').value = '';
      document.getElementById('projDesc').value = '';
      updatePreview();
    }

    function updatePreview() {
      document.getElementById('preview').innerHTML = `<p style="color:var(--gray-1)">Projekty: ${DEFAULTS.projects.length}</p>`;
    }

    function saveData() {
      const data = { ...DEFAULTS, hero: document.getElementById('hero').value, heroDesc: document.getElementById('heroDesc').value };
      localStorage.setItem('adminData', JSON.stringify(data));
      document.getElementById('msg').innerHTML = '<div class="msg success">Zapisano! Odśwież portfolio.</div>';
    }

    function loadData() {
      localStorage.setItem('adminData', JSON.stringify(DEFAULTS));
      document.getElementById('msg').innerHTML = '<div class="msg success">Wczytano dane demo.</div>';
    }

    window.addEventListener('keydown', e => { if (e.key === 'Enter') checkPwd(); });
  </script>
</body>
</html>
