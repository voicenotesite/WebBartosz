<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Terminal — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #080C18; --bg-2: #0D1221; --bg-card: #111827; --cyan: #00D4FF; --violet: #7C3AED; --violet-lt: #A855F7; --white: #F0F4FF; --gray-1: #94A3B8; --border: rgba(0,212,255,0.12); }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--white);font-family:'Inter',sans-serif;overflow:hidden}
    #bg-term{position:fixed;inset:0;font-family:'JetBrains Mono',monospace;font-size:clamp(0.5rem,1.5vw,0.8rem);color:#00ff88;padding:40px;opacity:0.15;pointer-events:none;overflow:hidden}
    .bg-line{margin:2px 0;white-space:nowrap}
    .bg-prompt{color:var(--cyan)}
    #auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:rgba(8,12,24,0.95);font-family:'JetBrains Mono',monospace;color:#00ff88;z-index:100}
    #admin-panel{display:none;position:relative;z-index:10;padding:40px;max-width:1200px;margin:0 auto}
    .term-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,0.6);overflow:hidden}
    .term-bar{display:flex;align-items:center;gap:7px;padding:12px 16px;background:rgba(0,212,255,0.05);border-bottom:1px solid var(--border)}
    .term-dot{width:11px;height:11px;border-radius:50%;background:#FF5F57}.term-dot:nth-child(2){background:#FEBC2E}.term-dot:nth-child(3){background:#28C840}
    .term-title{margin-left:auto;font-size:.72rem;color:var(--cyan);letter-spacing:.05em}
    .config-area{padding:20px}
    .section-label{font-family:'JetBrains Mono';font-size:.75rem;color:var(--cyan);letter-spacing:.18em;text-transform:uppercase;margin:20px 0 10px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
    .tab{padding:10px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--gray-1);transition:all .2s}
    .tab.active{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 20px rgba(0,212,255,0.2)}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;margin-bottom:6px;color:var(--gray-1);font-size:.85rem}
    input,textarea,select{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--white);font-family:inherit}
    button{padding:10px 16px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:var(--bg);border:none;border-radius:6px;cursor:pointer;margin:5px;transition:transform .2s}
    button:hover{transform:translateY(-2px)}
    .preview{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:15px;margin-top:15px}
    .msg{padding:10px;border-radius:6px;margin:10px 0;text-align:center;animation:fadeIn .3s}
    @keyframes fadeIn{from{opacity:0}}to{opacity:1}
    .msg.ok{background:rgba(74,222,128,0.1);color:#4ADE80;border:1px solid rgba(74,222,128,0.3)}
    [id^=tab-]{display:none}[id^=tab-].active{display:block}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .item-list{max-height:200px;overflow-y:auto}
    .item{display:flex;gap:8px;align-items:center;margin:8px 0}
    .remove{background:none;border:none;color:#ff4444;cursor:pointer;padding:0 8px}
  </style>
</head>
<body>
  <div id="bg-term"></div>
  <div id="auth-screen">
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:40px;text-align:center;min-width:320px">
      <div style="margin-bottom:20px">$ whoami_admin</div>
      <div style="color:var(--gray-1);margin-bottom:30px;font-size:.85rem">Enter password for GHOST_ROOT access</div>
      <input type="password" id="adminPwd" placeholder="password" style="width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);color:var(--white);border-radius:6px;font-family:'JetBrains Mono')">
      <button onclick="checkAdminPwd()" style="margin-top:16px">Enter</button>
    </div>
  </div>

  <div id="admin-panel">
    <div class="term-wrap">
      <div class="term-bar">
        <div class="term-dot"></div><div class="term-dot"></div><div class="term-dot"></div>
        <span class="term-title">~/admin -- PORTFOLIO CONFIG</span>
      </div>
      <div class="config-area">
        <div class="tabs">
          <div class="tab active" onclick="switchTab('hero')">Hero</div>
          <div class="tab" onclick="switchTab('projects')">Projects</div>
          <div class="tab" onclick="switchTab('skills')">Skills</div>
          <div class="tab" onclick="switchTab('experience')">Experience</div>
          <div class="tab" onclick="switchTab('socials')">Social</div>
        </div>
        <div id="tab-hero" class="tab-content">
          <div class="form-group"><label>Hero Title</label><input id="hero" value="Bartosz Osiej"></div>
          <div class="form-group"><label>Description</label><input id="heroDesc" value="AI Systems Engineer"></div>
        </div>
        <div id="tab-projects" class="tab-content" style="display:none">
          <div class="grid2"><input id="pName" placeholder="Name"><input id="pUrl" placeholder="URL"></div>
          <input id="pDesc" placeholder="Description" style="margin:10px 0">
          <button onclick="addProject()">+ Add Project</button>
          <div class="item-list" id="projList"></div>
        </div>
        <div id="tab-skills" class="tab-content" style="display:none">
          <input id="skillTitle" placeholder="Section Name" style="margin-bottom:10px">
          <button onclick="addSkill()">+ Add Skill Section</button>
          <div class="item-list" id="skillList"></div>
        </div>
        <div id="tab-experience" class="tab-content" style="display:none">
          <input id="eDate" placeholder="Date" style="margin-bottom:10px">
          <div class="grid2"><input id="eRole" placeholder="Role"><input id="eCompany" placeholder="Company"></div>
          <textarea id="eDesc" placeholder="Description" rows="3" style="margin-top:10px"></textarea>
          <button onclick="addExp()" style="margin-top:10px">+ Add Experience</button>
          <div class="item-list" id="expList"></div>
        </div>
        <div id="tab-socials" class="tab-content" style="display:none">
          <div class="form-group"><label>GitHub URL</label><input id="socialGithub"></div>
          <div class="form-group"><label>LinkedIn URL</label><input id="socialLinkedin"></div>
          <div class="form-group"><label>Email</label><input id="socialEmail"></div>
        </div>
        <div class="preview"><div class="section-label">// live preview</div><div id="preview"></div></div>
        <div id="msg"></div>
        <div><button onclick="saveData()">💾 Save</button><button onclick="loadDemo()">📂 Demo</button><button onclick="exportJson()">📥 Export</button></div>
      </div>
    </div>
  </div>

  <script>
    const PASS='host';
    let data=JSON.parse(localStorage.getItem('adminData'))||{hero:'Bartosz Osiej',heroDesc:'AI Systems Engineer',projects:[{name:'LinkShort',url:'https://fastapiurl.onrender.com',desc:'JWT URL shortener'},{name:'AI Chat Proxy',url:'https://ai-chat-proxy.onrender.com',desc:'18+ AI models'}]};
    const auth=document.getElementById('auth-screen'),panel=document.getElementById('admin-panel'),bgTerm=document.getElementById('bg-term');
    function checkAdminPwd(){if(document.getElementById('adminPwd').value===PASS){auth.style.display='none';panel.style.display='block';document.body.style.fontFamily="'JetBrains Mono',monospace";}}
    function switchTab(t){document.querySelectorAll('[id^=tab-]').forEach(x=>x.style.display='none');document.getElementById('tab-'+t).style.display='block';document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.onclick.toString().includes(t)));}
    function saveData(){localStorage.setItem('adminData',JSON.stringify(data));document.getElementById('msg').innerHTML='<div class="msg ok">Saved!</div>';setTimeout(()=>document.getElementById('msg').innerHTML='',2000);}
    function loadDemo(){localStorage.removeItem('adminData');location.reload();}
    function exportJson(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='portfolio.json';a.click();}
    function addProject(){const p={name:document.getElementById('pName').value,url:document.getElementById('pUrl').value,desc:document.getElementById('pDesc').value};if(p.name){data.projects.push(p);document.getElementById('projList').innerHTML+=`<div class="item">${p.name}<button class="remove" onclick="removeProject(${data.projects.length-1})">×</button></div>`;}}
    function removeProject(i){data.projects.splice(i,1);renderAll();}
    function addSkill(){const t=document.getElementById('skillTitle').value;if(t){data.skills=data.skills||[];data.skills.push({title:t,skills:[]});renderAll();}}
    function addExp(){const e={date:document.getElementById('eDate').value,role:document.getElementById('eRole').value,company:document.getElementById('eCompany').value,desc:document.getElementById('eDesc').value};if(e.role){data.experience=data.experience||[];data.experience.push(e);renderAll();}}
    function renderAll(){document.getElementById('hero').value=data.hero||'';document.getElementById('heroDesc').value=data.heroDesc||'';}

    // Background terminal animation
    const bgLines=['sudo ./portal','Loading...',`Welcome back, ADMIN`,'Class: NETHER - LEVEL 1000000 ✓','Status: ONLINE ✈️','uptime','1000000 days, 0 hours, 0 minutes','whoami','bartosz_admin','cat /proc/system/status','Perfect. Running at peak.','df -h','/dev/mem: 100% legendary','ps aux | grep legend','1 x legend','free -h','               total        used        free      shared  buff/cache   available','Mem:           100G        0G      100G        0G        0G      100G','top -b -n1','Legend: no process found','tail -f /var/log/system.log','System stable.','echo "sexy terminal animation"','Sexy? Very sexy. ✨'];
    let bgIdx=0;
    function bgAnim(){if(bgIdx>=bgLines.length)bgIdx=0;const l=document.createElement('div');l.className='bg-line';l.innerHTML=bgLines[bgIdx].replace(/^sudo/,'<span class="bg-prompt">$ </span><span class="t-cmd">sudo</span>').replace(/^[a-z]/,m=>'<span class="t-cmd">'+m+'</span>');bgTerm.appendChild(l);bgIdx++;setTimeout(bgAnim,Math.random()*1200+800);}
    setTimeout(bgAnim,1000);

    window.addEventListener('keydown',e=>{if(e.key==='Enter')checkAdminPwd();});
  </script>
</body>
</html>
