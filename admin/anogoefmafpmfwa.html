<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #080C18; --bg-2: #0D1221; --bg-card: #111827; --cyan: #00D4FF; --violet: #7C3AED; --white: #F0F4FF; --gray-1: #94A3B8; --border: rgba(0,212,255,0.12); }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--white);font-family:'Inter',sans-serif;overflow:hidden}
    #terminal{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);font-family:'JetBrains Mono',monospace;color:#00ff88;padding:20px}
    .term-inner{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,0.6);padding:30px;min-width:600px;max-width:900px}
    .term-bar{display:flex;align-items:center;gap:7px;padding:12px 16px;background:rgba(255,255,255,0.04);border-bottom:1px solid var(--border);margin-bottom:20px}
    .term-dot{width:11px;height:11px;border-radius:50%;background:#FF5F57}.term-dot:nth-child(2){background:#FEBC2E}.term-dot:nth-child(3){background:#28C840}
    .term-title{margin-left:auto;font-size:.72rem;color:var(--gray-2);letter-spacing:.05em}
    #term-output{line-height:1.8;font-size:.85rem;max-height:400px;overflow-y:auto}
    .t-prompt{color:var(--cyan)}.t-cmd{color:var(--white)}.t-out{color:var(--gray-1)}.t-ok{color:#4ADE80}.t-hl{color:var(--violet-lt)}.cursor{display:inline-block;width:8px;height:1em;background:var(--cyan);vertical-align:text-bottom;animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}.section-label{font-family:'JetBrains Mono';font-size:.75rem;color:var(--cyan);letter-spacing:.18em;text-transform:uppercase;margin:20px 0 10px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}[id^=tab-]{display:none}[id^=tab-].active{display:block}
    input,textarea,select{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--white);font-family:inherit}
    button{padding:10px 16px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:var(--bg);border:none;border-radius:6px;cursor:pointer;margin:5px}
  </style>
</head>
<body>
<div id="terminal">
  <div class="term-inner">
    <div class="term-bar">
      <div class="term-dot"></div><div class="term-dot"></div><div class="term-dot"></div>
      <span class="term-title">~/admin -- bash</span>
    </div>
    <div id="term-output"></div>
    <div class="section-label">// konfiguracja</div>
    <div id="tab-hero" class="tab-content">
      <input id="hero" placeholder="Hero Title" style="margin-bottom:10px">
      <input id="heroDesc" placeholder="Hero Description">
    </div>
    <div id="tab-projects" class="tab-content" style="display:none">
      <input id="pName" placeholder="Project Name" style="margin-bottom:10px">
      <input id="pUrl" placeholder="URL" style="margin-bottom:10px">
      <input id="pDesc" placeholder="Description">
      <button style="margin-top:10px" onclick="addProj()">Add Project</button>
    </div>
    <div id="tab-skills" class="tab-content" style="display:none">
      <input id="sTitle" placeholder="Skill Section" style="margin-bottom:10px">
      <button onclick="addSkill()">Add Skill</button>
    </div>
    <div id="tab-experience" class="tab-content" style="display:none">
      <input id="eDate" placeholder="Date" style="margin-bottom:10px">
      <input id="eRole" placeholder="Role" style="margin-bottom:10px">
      <input id="eCompany" placeholder="Company">
      <button style="margin-top:10px" onclick="addExp()">Add Experience</button>
    </div>
    <div style="margin-top:20px">
      <button onclick="saveData()">💾 Save</button>
      <button onclick="loadDemo()">📂 Demo</button>
    </div>
  </div>
</div>

<script>
const DEFAULTS={hero:'Bartosz Osiej',heroDesc:'AI Systems Engineer',projects:[{name:'LinkShort',url:'https://fastapiurl.onrender.com',desc:'JWT URL shortener'},{name:'AI Chat Proxy',url:'https://ai-chat-proxy.onrender.com',desc:'18+ AI models'}]};
let data={...DEFAULTS};
const out=document.getElementById('term-output');
const lines=['$','$ whoami','bartosz_admin','','$ ls ./config','hero: '+data.hero,'heroDesc: '+data.heroDesc,'$ cat ./projects.json',''+JSON.stringify(data.projects,null,2),'','$ echo "Class: NETHER - LEVEL 1000000"','Class: NETHER - LEVEL 1000000 ✅','','$ ./apply_changes.sh','✓ Changes applied successfully','$'];
function printLines(i=0){if(i>=lines.length)return;const l=document.createElement('div');l.innerHTML=lines[i];out.appendChild(l);setTimeout(()=>printLines(i+1),i%2?100:50)}
setTimeout(printLines,500);
function saveData(){localStorage.setItem('adminData',JSON.stringify(data));alert('Saved!');}
function loadDemo(){data=DEFAULTS;localStorage.removeItem('adminData');location.reload();}
function addProj(){const p={name:document.getElementById('pName').value,url:document.getElementById('pUrl').value,desc:document.getElementById('pDesc').value};data.projects.push(p);document.getElementById('pName').value='';}
function addSkill(){const t=document.getElementById('sTitle').value;alert('Added: '+t);}
function addExp(){const e={date:document.getElementById('eDate').value,role:document.getElementById('eRole').value,company:document.getElementById('eCompany').value};data.experience=[e,...(data.experience||[])];}
window.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=prompt('Command:')||'';if(v.startsWith('save')){saveData()}if(v==='demo'||v==='clear'){loadDemo()}})});
</script>
</body>
</html>
