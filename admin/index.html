<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080C18;
  --card:#111827;
  --border:rgba(0,212,255,0.12);
  --cyan:#00D4FF;
  --violet:#7C3AED;
  --text:#F0F4FF;
  --text-dim:#94A3B8;
}
*{transition:none!important}
body{font-family:system-ui;background:var(--bg);color:var(--text);min-height:100vh}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:20px;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:700;color:var(--cyan)}
main{max-width:1400px;margin:0 auto;padding:20px}
h2{color:var(--cyan);margin-bottom:20px;font-size:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.field{margin-bottom:20px}
.field label{display:block;color:var(--text-dim);margin-bottom:6px;font-size:0.85rem}
.field input,.field textarea,.field select{width:100%;padding:12px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;font-family:inherit}
.field textarea{min-height:100px;resize:vertical}
.btn{background:var(--cyan);color:#000;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:600}
.btn:hover{opacity:0.9}
.btn-secondary{background:var(--violet);color:#fff}
.preview{margin-top:30px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px}
.preview h3{color:var(--text);margin-bottom:10px}
.del{color:#ff6b6b;background:rgba(255,107,107,0.1);padding:6px 10px;border-radius:4px;margin-left:10px}
.social-item{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.social-item input{flex:1}
@media(max-width:768px){
  .grid{grid-template-columns:1fr}
  main{padding:10px}
}
</style>
</head>
<body>
<header>
<div class="header-inner">
<span class="logo">ADMIN PANEL</span>
<div><button class="btn" onclick="saveAll()">Save All</button></div>
</div>
</header>
<main>
<h2>Site Settings</h2>
<div class="grid">
<div class="field">
<label>Site Title</label>
<input id="siteTitle" placeholder="My Portfolio">
</div>
<div class="field">
<label>Your Name</label>
<input id="authorName" placeholder="Jan Kowalski">
</div>
<div class="field">
<label>Description</label>
<textarea id="siteDesc" placeholder="What this site is about"></textarea>
</div>
</div>

<h2 style="margin-top:30px">Hero Section</h2>
<div class="grid">
<div class="field">
<label>Hero Title (line 1)</label>
<input id="heroTitle1" placeholder="Cześć, jestem">
</div>
<div class="field">
<label>Hero Title (line 2)</label>
<input id="heroTitle2" placeholder="Jan Kowalski">
</div>
<div class="field">
<label>Hero Description</label>
<textarea id="heroDesc" placeholder="Your description"></textarea>
</div>
</div>

<h2>Social Links</h2>
<div id="socialList">
<div class="social-item">
<select onchange="addSocial(this.value)">
<option value="">+ Add Social</option>
<option value="github">GitHub</option>
<option value="linkedin">LinkedIn</option>
<option value="twitter">Twitter</option>
<option value="email">Email</option>
</select>
</div>
</div>
<div id="socialFields"></div>

<h2>Projects</h2>
<div id="projectList">
<div class="field">
<label>Project 1</label>
<input placeholder="Project name">
</div>
</div>
<button class="btn btn-secondary" onclick="addProject()">+ Add Project</button>

<h2>Sections Order</h2>
<div id="sectionOrder">
<label><input type="checkbox" checked> About</label><br>
<label><input type="checkbox" checked> Projects</label><br>
<label><input type="checkbox" checked> Experience</label><br>
<label><input type="checkbox" checked> Contact</label><br>
</div>

<h2>Preview</h2>
<div class="preview">
<div id="previewContent"></div>
</div>
</main>

<script>
let settings={
  title:"Bartosz Osiej Portfolio",
  name:"Bartosz Osiej",
  desc:"AI Systems Engineer",
  heroTitle1:"Building Systems That Work",
  heroTitle2:"",
  heroDesc:"AI infrastructure & scalable backends",
  socials:{github:"https://github.com/voicenotesite",linkedin:"",twitter:"",email:""},
  projects:[]
};

function addSocial(type){
  if(!type)return;
  const d=document.createElement('div');
  d.className='social-item';
  d.innerHTML=`
    <select onchange="updateSocialType(this,${Date.now()})">
      <option value="github" ${type==='github'?'selected':''}>GitHub</option>
      <option value="linkedin" ${type==='linkedin'?'selected':''}>LinkedIn</option>
      <option value="twitter" ${type==='twitter'?'selected':''}>Twitter</option>
      <option value="email" ${type==='email'?'selected':''}>Email</option>
    </select>
    <input placeholder="URL" value="${settings.socials[type]||''}">
    <button class="del" onclick="this.parentElement.remove()">×</button>`;
  document.getElementById('socialFields').appendChild(d);
}

function addProject(){
  const d=document.createElement('div');
  d.className='field';
  d.innerHTML='<label>Project</label><input placeholder="Project name URL tags">';
  document.getElementById('projectList').appendChild(d);
}

function saveAll(){
  localStorage.setItem('portfolio_settings',JSON.stringify(settings));
  alert('Settings saved!');
}

function loadAll(){
  const s=localStorage.getItem('portfolio_settings');
  if(s)settings=JSON.parse(s);
  document.getElementById('siteTitle').value=settings.title||'';
  document.getElementById('authorName').value=settings.name||'';
  document.getElementById('siteDesc').value=settings.desc||'';
  document.getElementById('heroTitle1').value=settings.heroTitle1||'';
  document.getElementById('heroTitle2').value=settings.heroTitle2||'';
  document.getElementById('heroDesc').value=settings.heroDesc||'';
}

window.onload=function(){loadAll()};
</script>
</body>
</html>
