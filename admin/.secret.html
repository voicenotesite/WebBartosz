<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Admin Console</title><style>
:root{--bg:#000;--cyan:#00ff88;--text:#e0e0e0;--font:monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:20px}
header{border-bottom:1px solid var(--cyan);padding:16px 20px;margin-bottom:20px}
.logo{color:var(--cyan);font-weight:700}
main{max-width:900px;margin:0 auto}
h2{color:var(--cyan);margin:16px 0 12px;font-size:1rem;border-bottom:1px solid #333;padding-bottom:8px}
.field{margin-bottom:14px}
.field label{display:block;color:#888;margin-bottom:4px;font-size:0.8rem}
input,textarea{width:100%;padding:10px;background:#111;border:1px solid #333;color:var(--cyan);font-family:inherit;border-radius:4px}
.btn{background:var(--cyan);color:#000;border:none;padding:8px 16px;margin:4px 4px 4px 0;font-weight:600;cursor:pointer;font-family:var(--font)}
.project-item{background:#111;border:1px solid #333;margin-bottom:8px;padding:10px;display:flex;gap:8px}
.project-item input{flex:1;background:#0a0a0a;border:1px solid #333;color:var(--cyan)}
#preview{background:#111;border:1px solid var(--cyan);margin-top:20px;padding:16px;min-height:120px}
#preview h3{color:var(--cyan);margin-bottom:12px;font-size:1rem}
.output{background:#111;border:1px solid #333;padding:12px;margin-top:20px;font-size:0.8rem}
.output .label{color:#888;display:block;margin-bottom:6px}
</style></head><body>
<header><span class="logo">&gt; ADMIN CONSOLE — BARTOSZ OSIJE</span></header>
<main>
<h2>IDENTITY</h2>
<div class="field"><input id="name" placeholder="Name" value="Bartosz Osiej"/></div>
<div class="field"><input id="title" placeholder="Title" value="AI Systems Engineer"/></div>
<h2>HERO</h2>
<div class="field"><input id="hero1" placeholder="Hero line 1" value="Bartosz"/></div>
<div class="field"><input id="hero2" placeholder="Hero line 2" value="Osiej"/></div>
<div class="field"><textarea id="heroDesc" placeholder="Description">Buduję infrastrukturę AI, produkcyjne API i skalowalne systemy backendowe.</textarea></div>
<h2>PROJECTS</h2>
<div id="projectList"></div>
<button class="btn" onclick="addProject()">+ ADD PROJECT</button>
<button class="btn" onclick="save()">SAVE</button>
<h2>PREVIEW</h2>
<div id="preview"><div id="previewContent"></div></div>
<div class="output"><span class="label">$ localStorage dump:</span><code id="dump"></code></div>
</main>
<script>
let data={name:'Bartosz Osiej',title:'AI Systems Engineer',hero1:'Bartosz',hero2:'Osiej',heroDesc:'Buduję infrastrukturę AI, produkcyjne API i skalowalne systemy backendowe.',projects:[]};
function load(){const s=localStorage.getItem('adminData');if(s)data=JSON.parse(s);}
function render(){
document.getElementById('name').value=data.name||'';
document.getElementById('title').value=data.title||'';
document.getElementById('hero1').value=data.hero1||'';
document.getElementById('hero2').value=data.hero2||'';
document.getElementById('heroDesc').value=data.heroDesc||'';
const pl=document.getElementById('projectList');pl.innerHTML='';
(data.projects||[]).forEach((p,i)=>{const div=document.createElement('div');div.className='project-item';div.innerHTML=`<input value="${p.name||''}"oninput="data.projects[${i}].name=this.value"placeholder="Name"><input value="${p.url||''}"oninput="data.projects[${i}].url=this.value"placeholder="URL"><input value="${p.desc||''}"oninput="data.projects[${i}].desc=this.value"placeholder="Desc"><button class="btn" onclick="data.projects.splice(${i},1);render()" style="background:#f44;color:#000">×</button>`;pl.appendChild(div)});
document.getElementById('previewContent').innerHTML=`<strong>${data.name}</strong><br>${data.title}<br>${data.hero1} ${data.hero2}<br><br>Projects: ${(data.projects||[]).length}`;
document.getElementById('dump').textContent=JSON.stringify(data,null,2);}
function addProject(){data.projects=data.projects||[];data.projects.push({name:'',url:'',desc:''});render();}
function save(){localStorage.setItem('adminData',JSON.stringify(data));alert('Saved! Reload main site to see changes.');}
window.onload=()=>{load();render();};
document.getElementById('name').oninput=()=>{data.name=this.value;render();}
document.getElementById('title').oninput=()=>{data.title=this.value;render();}
document.getElementById('hero1').oninput=()=>{data.hero1=this.value;render();}
document.getElementById('hero2').oninput=()=>{data.hero2=this.value;render();}
document.getElementById('heroDesc').oninput=()=>{data.heroDesc=this.value;render();}
</script></body></html>
