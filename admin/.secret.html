<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;
  --card:#0a0a0a;
  --border:#00ff88;
  --text:#00ff88;
  --text-dim:#888;
  --font:monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
header{border-bottom:1px solid var(--border);padding:16px;background:#000}
.logo{font-weight:700;color:var(--border);font-size:1.2rem}
main{max-width:1000px;margin:0 auto;padding:20px}
h2{border-bottom:1px solid #333;padding-bottom:8px;margin:20px 0 12px;color:var(--border)}
.field{margin-bottom:16px}
.field label{display:block;color:var(--text-dim);margin-bottom:4px;font-size:0.75rem}
input{width:100%;padding:8px;background:#000;border:1px solid #333;color:var(--text);font-family:var(--font);font-size:0.85rem}
.btn{background:var(--border);color:#000;border:none;padding:6px 16px;font-family:var(--font);font-weight:600;cursor:pointer;margin-right:8px;font-size:0.8rem}
.btn-secondary{background:#333;color:var(--text)}
.list{background:#000;border:1px solid #333;border-radius:6px;padding:10px;margin-top:8px;max-height:200px;overflow-y:auto}
.item{background:#0a0a0a;padding:8px;margin-bottom:6px;border:1px solid #333;display:flex;gap:8px;align-items:center}
.item input{flex:1;background:#000;border:none;color:var(--text);font-size:0.8rem;padding:4px;font-family:var(--font)}
.del{color:#ff4444;background:rgba(255,68,68,0.1);border:none;padding:4px 8px;font-family:var(--font);cursor:pointer;font-size:0.75rem}
.preview{margin-top:24px;background:#000;border:1px solid var(--border);border-radius:6px;padding:16px}
.preview h3{color:var(--border);margin-bottom:12px;font-size:1rem}
.preview-content{font-size:0.85rem;color:var(--text-dim);max-height:300px;overflow-y:auto;white-space:pre-wrap}
.output{background:#000;border:1px solid #333;border-radius:6px;padding:12px;margin-top:16px;font-family:var(--font);font-size:0.75rem}
.output .label{color:var(--text-dim);display:block;margin-bottom:4px}
.output code{display:block;color:var(--text);white-space:pre-wrap}
</style>
</head>
<body>
<header><span class="logo">&gt; ADMIN CONSOLE</span></header>
<main>
<h2>PHP_OS / Identity</h2>
<div class="field"><input id="name" placeholder="Name"></div>
<div class="field"><input id="title" placeholder="Title"></div>
<h2>HERO</h2>
<div class="field"><input id="hero1" placeholder="Hero Line 1"></div>
<div class="field"><input id="hero2" placeholder="Hero Line 2"></div>
<div class="field"><input id="heroDesc" placeholder="Description"></div>
<h2>PROJECTS</h2>
<div id="projectList" class="list"></div>
<button class="btn btn-secondary" onclick="addProject()">+ ADD</button>
<button class="btn" onclick="save()">SAVE</button>
<h2>LIVE PREVIEW</h2>
<div class="preview"><div id="preview" class="preview-content"></div></div>
<div class="output">
  <span class="label">$ localStorage dump:</span>
  <code id="dump"></code>
</div>
</main>
<script>
let d={name:'Bartosz Osiej',title:'AI Systems Engineer',hero1:'Building Systems That Work',hero2:'',heroDesc:'',projects:[]};
function addProject(){d.projects.push({name:'',url:'',desc:''});render()}
function render(){
  document.getElementById('name').value=d.name;
  document.getElementById('title').value=d.title;
  document.getElementById('hero1').value=d.hero1;
  document.getElementById('hero2').value=d.hero2;
  document.getElementById('heroDesc').value=d.heroDesc;
  const g=document.getElementById('projectList');g.innerHTML='';
  d.projects.forEach((p,i)=>{const div=document.createElement('div');div.className='item';div.innerHTML=`<input value="${p.name||''}"onchange="d.projects[${i}].name=this.value"placeholder="Name"><input value="${p.url||''}"onchange="d.projects[${i}].url=this.value"placeholder="URL">`;g.appendChild(div)})
  document.getElementById('preview').textContent=d.name+' - '+d.title+' | '+d.hero1+(d.hero2?' '+d.hero2:'')+', '+d.projects.length+' projects';
  document.getElementById('dump').textContent=JSON.stringify(d,null,2);
}
function save(){localStorage.setItem('adminData',JSON.stringify(d));alert('Saved to localStorage')}
function load(){const s=localStorage.getItem('adminData');if(s)d=JSON.parse(s)}
window.onload=function(){load();render()}
</script>
</body>
</html>
