<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080C18;
  --card:#111827;
  --border:rgba(0,212,255,0.12);
  --cyan:#00D4FF;
  --violet:#7C3AED;
  --text:#F0F4FF;
  --text-dim:#94A3B8;
}
body{font-family:system-ui;background:var(--bg);color:var(--text);min-height:100vh}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:16px;z-index:100}
.logo{font-weight:700;color:var(--cyan);font-size:1.2rem}
main{max-width:1200px;margin:0 auto;padding:16px}
h2{color:var(--cyan);margin:20px 0 12px;font-size:1.2rem}
.field{margin-bottom:16px}
.field label{display:block;color:var(--text-dim);margin-bottom:4px;font-size:0.8rem}
input,textarea{width:100%;padding:10px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:4px;font-family:inherit}
.row{display:flex;gap:12px;align-items:center}
.btn{background:var(--cyan);color:#000;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-weight:600;font-size:0.85rem;margin-right:8px}
.btn-secondary{background:var(--violet);color:#fff}
.list{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;margin-top:8px;max-height:200px;overflow-y:auto}
.item{background:rgba(0,0,0,0.2);padding:8px;margin-bottom:6px;border-radius:4px;display:flex;gap:8px;align-items:center}
.item input{flex:1;background:rgba(0,0,0,0.3);border:none;padding:6px;color:var(--text);font-size:0.85rem}
.del{color:#ff6b6b;background:rgba(255,107,107,0.1);border:none;padding:4px 8px;border-radius:3px;cursor:pointer;font-size:0.8rem}
.preview{margin-top:24px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
.preview h3{color:var(--cyan);margin-bottom:12px;font-size:1rem}
.preview-content{font-size:0.8rem;color:var(--text-dim);max-height:300px;overflow-y:auto}
@keyframes pulse{0%,100%{opacity:0.6}50%{opacity:1}}
.loading{animation:pulse 1.5s infinite}
@media(max-width:768px){main{padding:10px}input{font-size:16px}}
</style>
</head>
<body>
<header><span class="logo">ADMIN PANEL</span></header>
<main>
<h2>Identity</h2>
<div class="field"><input id="name" placeholder="Name"></div>
<div class="field"><input id="title" placeholder="Title"></div>
<h2>Hero</h2>
<div class="field"><input id="hero1" placeholder="Hero Line 1"></div>
<div class="field"><input id="hero2" placeholder="Hero Line 2"></div>
<div class="field"><input id="heroDesc" placeholder="Description"></div>
<h2>Projects</h2>
<div id="projectList" class="list"></div>
<button class="btn btn-secondary" onclick="addProject()">+ Add</button>
<button class="btn" onclick="save()">Save</button>
<h2>Preview</h2>
<div class="preview"><div id="preview" class="preview-content"></div></div>
</main>
<script>
let d={name:'Bartosz Osiej',title:'AI Systems Engineer',hero1:'Building Systems That Work',hero2:'',heroDesc:'',projects:[]};
function addProject(){d.projects.push({name:'',url:'',desc:''});render()}
function render(){
  document.getElementById('name').value=d.name;
  document.getElementById('title').value=d.title;
  document.getElementById('hero1').value=d.hero1;
  document.getElementById('hero2').value=d.hero2;
  document.getElementById('heroDesc').value=d.heroDesc;
  const g=document.getElementById('projectList');g.innerHTML='';
  d.projects.forEach((p,i)=>{const div=document.createElement('div');div.className='item';div.innerHTML=`<input value="${p.name||''}"onchange="d.projects[${i}].name=this.value"placeholder="Name"><input value="${p.url||''}"onchange="d.projects[${i}].url=this.value"placeholder="URL">`;g.appendChild(div)})
  document.getElementById('preview').innerHTML=`<strong>${d.name}</strong><br>${d.title}<br>${d.hero1}${d.hero2?' '+d.hero2:''}<br><br>Projects: ${d.projects.length}`;
}
function save(){localStorage.setItem('adminData',JSON.stringify(d));alert('Saved!')}
function load(){const s=localStorage.getItem('adminData');if(s)d=JSON.parse(s)}
window.onload=function(){load();render()}
</script>
</body>
</html>
