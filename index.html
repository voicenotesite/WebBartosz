<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Bartosz Osiej</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#00ff88;font-family:monospace;height:100vh;overflow:hidden}
#terminal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:9999}
#site{display:none;width:100%}
#err{color:#f44;opacity:0}
header{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(0,0,0,0.9);border-bottom:1px solid #00ff88;display:flex;align-items:center}
.logo{font-weight:700;font-size:1.25rem;padding:20px;color:#00ff88}
.hero{display:flex;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;background:#000}
.hero h1{font-size:clamp(2rem,6vw,4rem);color:#00ff88;margin-bottom:20px}
.hero p{color:#888;margin-bottom:40px}
.btn{background:#00ff88;color:#000;padding:12px 30;border-radius:32px;font-weight:700;text-decoration:none;display:inline-block;margin-top:20px}
.projects{padding:40px 20px}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;max-width:1200px;margin:0 auto}
.project{background:rgba(26,26,58,0.6);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:20px}
.project h3{color:#00ff88;margin-bottom:8px}
.project p{color:#888;font-size:0.9rem}
.footer{border-top:1px solid #00ff88;padding:40px;text-align:center;color:#666;margin-top:40px}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:0}}
.flicker{animation:flicker 0.1s 30}
</style></head><body>
<div id="terminal">
<pre style="color:#00ff88">BARTOSZ OSIJE :: PORTFOLIO
<span id="err">ERROR 404 :: SYSTEM FAILURE</span>
<span id="cmd">$ access denied</span></pre>
</div>
<div id="site">
<header><span class="logo">&gt; bartosz@portfolio:~$ whoami</span></header>
<section class="hero">
<div style="text-align:center;padding:40px">
<h1>BUILDING SYSTEMS THAT WORK</h1>
<p>AI infrastructure • Production APIs • Scalable backends</p>
<a href="#projects" class="btn">View Projects</a>
</div>
</section>
<section class="projects" id="projects">
<div class="projects-grid" id="grid"></div>
</section>
<div class="footer">
<p>© 2025 Bartosz Osiej | <a href="admin/.secret.html">Admin</a></p>
</div>
</div>
<script>
// Data
let data=JSON.parse(localStorage.getItem('adminData')||'{}');
let projects=[
{name:'LinkShort',url:'https://fastapiurl.onrender.com',desc:'JWT URL shortener'},
{name:'AI Chat Proxy',url:'https://ai-chat-proxy-twj4.onrender.com',desc:'18+ AI models'},
{name:'GraphQL Blog',url:'https://graphql-blog-lxjy.onrender.com/graphql',desc:'Blog API'}
];
if(data.projects&&data.projects.length)projects=data.projects;
// Animation
document.getElementById('err').className='flicker';
setTimeout(()=>{document.getElementById('cmd').textContent='$ booting...';setTimeout(()=>{document.getElementById('terminal').style.opacity=0;document.getElementById('terminal').style.transition='opacity 0.5s';setTimeout(()=>{document.getElementById('terminal').style.display='none';document.getElementById('site').style.display='block';document.body.style.overflow='auto'},500)},400)},1800);
// Render
const g=document.getElementById('grid');projects.forEach(p=>{const d=document.createElement('div');d.className='project';d.innerHTML='<h3>'+p.name+'</h3><p>'+p.desc+'</p>';g.appendChild(d)});
if(data.name)document.querySelector('.logo').textContent='> '+data.name+' ~$';
if(data.hero1)document.querySelector('.hero h1').textContent=data.hero1;
</script>
</body>
</html>
