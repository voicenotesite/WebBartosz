services:
  - type: web
    name: telegram-chat-bot
    region: frankfurt
    plan: free
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: YOUR_TELEGRAM_CHAT_ID
        sync: false